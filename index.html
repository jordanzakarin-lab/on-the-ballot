<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Progressive Ballot Initiatives</title>
</head>
<body>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:0.5rem 0 3rem}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1.25rem;position:sticky;top:0;background:var(--color-background-primary);padding:0.75rem 0 0.5rem;z-index:10;border-bottom:0.5px solid var(--color-border-tertiary)}
.npill{font-size:11px;padding:4px 9px;border-radius:99px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;white-space:nowrap;transition:all 0.12s}
.npill.on{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.section{margin-bottom:2rem}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:0.6rem}
.sec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sec-title{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.sec-count{font-size:11px;color:var(--color-text-tertiary)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-size:10px;font-weight:500;color:var(--color-text-tertiary);padding:4px 7px;border-bottom:0.5px solid var(--color-border-tertiary);letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap}
td{padding:6px 7px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);vertical-align:top;line-height:1.4}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.tc a{color:var(--color-text-primary);text-decoration:none;font-weight:500;font-size:11.5px}
.tc a:hover{text-decoration:underline}
.dc{color:var(--color-text-secondary);font-size:11px;line-height:1.45}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:99px;font-weight:500;white-space:nowrap}
.sq{background:#EAF3DE;color:#3B6D11}
.sc{background:#E6F1FB;color:#185FA5}
.ss{background:#FAEEDA;color:#854F0B}
.en{background:#E1F5EE;color:#0F6E56}
.ex{background:#F1EFE8;color:#5F5E5A}
.lc{background:#FCEBEB;color:#A32D2D}
.ps{background:#E1F5EE;color:#0F6E56;font-weight:600}
.lv{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:500;white-space:nowrap;margin-bottom:2px}
.lv-s{background:#EEEDFE;color:#534AB7}
.lv-c{background:#FBEAF0;color:#993556}
.lv-co{background:#FAEEDA;color:#854F0B}
.date-cell{white-space:nowrap;font-size:11px;color:var(--color-text-secondary);min-width:90px}
.loc-cell{font-size:11px;color:var(--color-text-secondary);white-space:nowrap;min-width:100px}
.note{font-size:10.5px;color:var(--color-text-tertiary);font-style:italic;margin-top:4px;padding:4px 7px;border-top:0.5px solid var(--color-border-tertiary)}
.passed{background:#E1F5EE;color:#0F6E56;font-weight:600}
.failed{background:#FCEBEB;color:#A32D2D;font-weight:600}
</style>
<div class="wrap">
<div class="nav" id="nav">
  <button class="npill on" data-s="all">All</button>
  <button class="npill" data-s="tax">💰 Tax wealthy</button>
  <button class="npill" data-s="econ">⚖️ Economic justice</button>
  <button class="npill" data-s="edu">🎓 Education</button>
  <button class="npill" data-s="housing">🏠 Housing</button>
  <button class="npill" data-s="transit">🚌 Transit</button>
  <button class="npill" data-s="env">🌿 Environment</button>
  <button class="npill" data-s="data">🖥 Data centers</button>
  <button class="npill" data-s="voting">🗳 Voting/Democracy</button>
  <button class="npill" data-s="civil">✊ Civil rights</button>
  <button class="npill" data-s="repro">⚕️ Repro rights</button>
</div>
<div id="content"></div>
</div>
<script>
const C={tax:'#185FA5',econ:'#0F6E56',edu:'#854F0B',housing:'#993C1D',transit:'#534AB7',env:'#3B6D11',data:'#3B6D11',voting:'#185FA5',civil:'#993556',repro:'#A32D2D'};
const TL={tax:'Taxing the Wealthy',econ:'Economic Justice',edu:'Education',housing:'Housing',transit:'Public Transit',env:'Environment',data:'Data Centers / AI',voting:'Voting Rights & Democracy',civil:'Civil Rights',repro:'Reproductive Rights'};
const SBC={'Qualified for ballot':'sq','Collecting signatures':'sc','Signatures submitted':'ss','Enacted / defend':'en','Exploring / filed':'ex','Legal challenge':'lc','Approved for circulation':'sc','PASSED ✓':'ps','Passed':'passed','Failed':'failed'};
const lvb=d=>d.lv==='city'?`<span class="lv lv-c">local</span>`:d.lv==='county'?`<span class="lv lv-co">county</span>`:`<span class="lv lv-s">state</span>`;

const D=[
  // TAX
  {cat:'tax',lv:'state',loc:'CA (statewide)',title:'California Billionaire Tax Act',desc:'5% one-time wealth tax on ~200 billionaires (net worth $1B+). Revenue for Medi-Cal, K-14 education, food aid. Backed by SEIU-UHW. ~25% of ~875K signatures collected.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://ballotpedia.org/California_One-Time_Wealth_Tax_for_State-Funded_Health_Care_Programs_Initiative_(2026)'},
  {cat:'tax',lv:'state',loc:'WA (statewide)',title:'Washington Millionaires Tax (SB 6346) — defend vs. repeal',desc:'9.9% income tax on households earning $1M+. Signed into law March 30. Opponents pursuing repeal initiative; need ~309K signatures by July 2.',status:'Enacted / defend',date:'Nov 3, 2026',link:'https://washingtonstatestandard.com/2026/03/28/as-washington-gets-an-income-tax-the-fight-to-overturn-it-begins/'},
  {cat:'tax',lv:'state',loc:'CO (statewide)',title:'Colorado Graduated Income Tax Initiative',desc:'Replaces flat 4.4% with brackets up to 8.4% on income $500K+. Would raise $2.7B for schools, health care, child care. Signature drive launched March 17.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://www.aspentimes.com/news/colorado-raise-taxes-higher-earners-signatures-ballot/'},
  {cat:'tax',lv:'city',loc:'San Francisco, CA',title:'SF Overpaid CEO Act (Prop D)',desc:'Surcharge on companies with $1B+ US earnings where top exec earns 100x+ median SF employee. Would generate ~$200M/year. Backed by SEIU 1021 & 2015. Qualified for June ballot. Dueling Prop C from Chamber of Commerce also on same ballot.',status:'Qualified for ballot',date:'Jun 2, 2026',link:'https://www.sfexaminer.com/news/politics/sf-overpaid-executive-tax-june-2026-ballot-battle/article_756cd74f-7b47-450a-beb9-4da371f3275a.html'},
  {cat:'tax',lv:'city',loc:'San Francisco, CA',title:'SF Overpaid CEO + Ride-Hailing Tax (Supervisors, Nov)',desc:'SF Supervisors Connie Chan et al. propose reinstating prior overpaid exec tax structure plus new taxes on Uber/Lyft/Waymo (similar to 2024 Prop L which was nullified by Prop M). Would raise ~$150–200M/year.',status:'Exploring / filed',date:'Nov 3, 2026',link:'https://www.kqed.org/news/12061967/sf-supervisors-propose-tax-on-wealthy-ceos-ride-hailing-companies-for-2026-ballot'},
  {cat:'tax',lv:'city',loc:'Los Angeles, CA',title:'LA CEO Pay Ratio Tax (Unite HERE)',desc:'0.5% gross receipts surcharge on large LA companies where top exec earns 100x+ median LA employee pay. Higher rates for more extreme ratios. Filed with city clerk.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://mynewsla.com/business/2025/06/24/labor-union-files-two-new-voter-initiatives-zoning-in-on-excessive-ceo-pay/'},
  // ECONOMIC JUSTICE
  {cat:'econ',lv:'state',loc:'OK (statewide)',title:'Oklahoma $15 Minimum Wage (State Question 832)',desc:'Raises state minimum wage to $15/hour by 2029. 157K+ certified signatures. Delayed by Gov. Stitt from 2024.',status:'Qualified for ballot',date:'Jun 16, 2026',link:'https://ballotpedia.org/Oklahoma_State_Question_832,_$15_Minimum_Wage_Initiative_(June_2026)'},
  {cat:'econ',lv:'city',loc:'Los Angeles, CA',title:'LA $30 Citywide Minimum Wage (Unite HERE)',desc:'Extends $30/hr minimum wage to all LA workers by July 2028 (currently only hotel/airport workers). Filed by Unite HERE Local 11. Signatures being collected. Business repeal referendum failed to qualify Sept 2025.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://www.foxla.com/news/30-minimum-wage-la-citywide-employees'},
  {cat:'econ',lv:'city',loc:'Los Angeles, CA',title:'LA Hotel & Event Center Voter Approval Requirement',desc:'Requires citywide voter approval for large hotel, concert hall, stadium and venue projects receiving city subsidies. Counter to business interests; potentially affects 2028 Olympic venues.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://www.unitehere11.org/hospitality-union-files-initiative-petitions-to-raise-la-minimum-wage-to-30-hour-for-all-workers-and-require-voter-approval-of-hotel-and-event-center-subsidies/'},
  {cat:'econ',lv:'city',loc:'Los Angeles, CA',title:'LA Limit City Property Access for High CEO-Pay Companies',desc:'Requires voter approval for contracts giving companies (100:1+ CEO-to-worker pay ratio) access to city-owned property — harbor, airport, convention center, film permit sites.',status:'Exploring / filed',date:'Nov 3, 2026',link:'https://mynewsla.com/business/2025/06/24/labor-union-files-two-new-voter-initiatives-zoning-in-on-excessive-ceo-pay/'},
  {cat:'econ',lv:'city',loc:'Washington, DC',title:'DC Living Wage for All ($25/hr + end tipped subminimum)',desc:'Raises DC minimum wage to $25/hr over several years and eliminates the tipped wage credit. Reverses DC Council\'s partial rollback of voter-approved Initiative 82. Initiative filed.',status:'Exploring / filed',date:'Nov 3, 2026',link:'https://www.nbcwashington.com/news/local/workers-labor-advocates-call-for-dc-to-raise-minimum-wage-to-25/4025867/'},
  {cat:'econ',lv:'state',loc:'MA (statewide)',title:'Massachusetts Expanded Paid Family & Medical Leave',desc:'Expands eligibility for existing paid family and medical leave program. First-round signatures submitted.',status:'Signatures submitted',date:'Nov 3, 2026',link:'https://www.mass.gov/info-details/ballot-initiatives-submitted-for-the-2026-biennial-statewide-election-proposed-laws-and-2028-biennial-statewide-election-proposed-constitutional-amendments'},
  // EDUCATION
  {cat:'edu',lv:'state',loc:'NE (statewide)',title:'Nebraska $50K Minimum Teacher Salary (APPLE Plan)',desc:'Sets $50K starting salary for all certified public school teachers, state-funded. Needs ~88K signatures by July 2026.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://nebraskaexaminer.com/2025/09/29/new-nebraska-property-tax-relief-petition-adds-push-for-50k-base-salary-for-public-school-teachers/'},
  // HOUSING
  {cat:'housing',lv:'city',loc:'Washington, DC',title:'DC Housing Modernization & Accessibility Act (Rent Freeze)',desc:'Two-year immediate rent freeze; future freezes when CPI exceeds 5%; lowers affordability threshold to 60% AMI. Third draft submitted. Board of Elections delayed subject matter ruling. Deadline July 6 for signatures.',status:'Legal challenge',date:'Nov 3, 2026',link:'https://moreaffordabledc.org/'},
  {cat:'housing',lv:'state',loc:'MA (statewide)',title:'Massachusetts Rent Control Initiative',desc:'Repeals 1994 statewide ban; caps annual rent increases at 5% or inflation. 124K+ signatures submitted. Facing real estate industry lawsuit.',status:'Signatures submitted',date:'Nov 3, 2026',link:'https://ballotpedia.org/Massachusetts_Rent_Control_Initiative_(2026)'},
  {cat:'housing',lv:'state',loc:'MA (statewide)',title:'Massachusetts Right to Counsel in Eviction Proceedings (x2)',desc:'Free legal representation for low-income tenants facing eviction. Two versions filed (25-30 and 25-31).',status:'Signatures submitted',date:'Nov 3, 2026',link:'https://www.mass.gov/info-details/ballot-initiatives-submitted-for-the-2026-biennial-statewide-election-proposed-laws-and-2028-biennial-statewide-election-proposed-constitutional-amendments'},
  {cat:'housing',lv:'state',loc:'MA (statewide)',title:'Massachusetts Minimum Lot Size for Single-Family Homes',desc:'Allows homes on lots as small as 5,000 sq ft in areas with adequate infrastructure to boost housing supply.',status:'Signatures submitted',date:'Nov 3, 2026',link:'https://www.mass.gov/info-details/ballot-initiatives-submitted-for-the-2026-biennial-statewide-election-proposed-laws-and-2028-biennial-statewide-election-proposed-constitutional-amendments'},
  {cat:'housing',lv:'state',loc:'CA (statewide)',title:'California CSU Staff First-Time Homebuyer Loan Initiative',desc:'Homeownership loan program for CSU staff plus single-family housing construction support.',status:'Exploring / filed',date:'Nov 3, 2026',link:'https://ballotpedia.org/Housing_on_the_ballot'},
  // TRANSIT
  {cat:'transit',lv:'city',loc:'San Francisco, CA',title:'SF Muni Parcel Tax ("Stronger Muni for All")',desc:'Parcel tax to fund Muni. Single-family homes pay ~$129/year; large commercial properties up to $400K/year; renters capped at $65/year. Would raise ~$187M/year. Mayor Lurie signed signature drive March 4.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://www.axios.com/local/san-francisco/2026/03/03/sf-ballot-measure-muni-parcel-tax-renters-homeowners-bart-public-transit-november'},
  {cat:'transit',lv:'city',loc:'Seattle, WA',title:'Seattle Transit Measure (STM) Renewal',desc:'Renewal of 0.15% sales tax funding extra Metro bus service, ORCA passes for low-income riders, streetcar operations. Current measure expires April 2027. SDOT preparing renewal package for November 2026 ballot. Countywide King County measure unlikely this cycle.',status:'Exploring / filed',date:'Nov 3, 2026',link:'https://seattletransitblog.com/2026/03/05/seattle-transit-measure-renewal-and-a-course-for-more-frequent-transit/'},
  // ENVIRONMENT
  {cat:'env',lv:'state',loc:'MO (statewide)',title:'Missouri Sales Tax for Parks & Conservation (Amendment 1)',desc:'Renews 1/10-cent sales tax for state parks and soil conservation. Legislatively referred.',status:'Qualified for ballot',date:'Nov 3, 2026',link:'https://ballotpedia.org/Ballot_Measure_Scorecard,_2026'},
  {cat:'env',lv:'state',loc:'AR (statewide)',title:'Arkansas Environmental Preservation Amendment',desc:'Citizen-initiated constitutional amendment to strengthen environmental protections.',status:'Exploring / filed',date:'Nov 3, 2026',link:'https://ballotpedia.org/Environment_on_the_ballot'},
  {cat:'env',lv:'state',loc:'MA (statewide)',title:'Massachusetts Nature for All Fund Initiative',desc:'Dedicated conservation fund for nature access and preservation.',status:'Exploring / filed',date:'Nov 3, 2026',link:'https://ballotpedia.org/Environment_on_the_ballot'},
  {cat:'env',lv:'state',loc:'MA (statewide)',title:'Massachusetts Zero-Emission Vehicles & Home Energy Initiative',desc:'Accelerates EV mandates and zero-emission heating standards.',status:'Signatures submitted',date:'Nov 3, 2026',link:'https://www.mass.gov/info-details/ballot-initiatives-submitted-for-the-2026-biennial-statewide-election-proposed-laws-and-2028-biennial-statewide-election-proposed-constitutional-amendments'},
  // DATA CENTERS
  {cat:'data',lv:'city',loc:'Port Washington, WI',title:'Port Washington TID Voter Approval Requirement',desc:'Requires voter approval for future Tax Incremental Districts with value/cost $10M+. Sparked by $15B Vantage/OpenAI/Oracle campus. PASSED 66-34% — first-in-nation data center referendum.',status:'PASSED ✓',date:'Apr 7, 2026 ✓',link:'https://dailycaller.com/2026/04/08/port-washington-wisconsin-data-center-vote-trump-charlie-berens/'},
  {cat:'data',lv:'city',loc:'Janesville, WI',title:'Janesville Major Development Voter Approval Requirement',desc:'Requires voter approval for $450M+ development on GM/JATCO site. Targets proposed $8B, 800-MW data center campus.',status:'Qualified for ballot',date:'Nov 3, 2026',link:'https://news.ballotpedia.org/2026/02/19/voters-in-two-wisconsin-cities-to-decide-on-ballot-measures-related-to-data-center-development/'},
  {cat:'data',lv:'city',loc:'Boulder City, NV',title:'Boulder City Data Center Land Use (Question 1)',desc:'Asks whether to allow data centers on city-owned Eldorado Valley land. City controls its own utility and would not sell power to data centers.',status:'Qualified for ballot',date:'Nov 3, 2026',link:'https://www.reviewjournal.com/news/environment/data-centers-will-be-on-the-ballot-in-this-southern-nevada-city-3727498/'},
  {cat:'data',lv:'state',loc:'OH (statewide)',title:'Ohio Prohibition of Data Center Construction Amendment',desc:'Constitutional ban on data centers drawing >25 MW. Cleared Ohio Ballot Board April 3. Volunteer campaign needs 413K+ signatures from 44 counties by ~July 1.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://ohiocapitaljournal.com/2026/04/03/data-center-ban-on-the-ohio-ballot-petitioners-get-approval-to-start-gathering-signatures/'},
  {cat:'data',lv:'city',loc:'Marana, AZ',title:'Marana Data Center Referendum',desc:'Referendum on data center development. Signatures submitted Feb 2026.',status:'Signatures submitted',date:'TBD 2026',link:'https://news.ballotpedia.org/2026/03/24/voters-in-at-least-five-jurisdictions-will-decide-ballot-measures-related-to-data-centers-this-year/'},
  {cat:'data',lv:'county',loc:'Frederick County, MD',title:'Frederick County Data Center Petition',desc:'Petition requiring voter say on data center development in the county.',status:'Collecting signatures',date:'TBD 2026',link:'https://news.ballotpedia.org/2026/03/24/voters-in-at-least-five-jurisdictions-will-decide-ballot-measures-related-to-data-centers-this-year/'},
  {cat:'data',lv:'city',loc:'Joplin / Festus / Independence, MO',title:'Missouri Local Data Center Petitions (3 cities)',desc:'Petitions circulating in Joplin, Festus, and Independence, MO.',status:'Collecting signatures',date:'TBD 2026',link:'https://news.ballotpedia.org/2026/03/24/voters-in-at-least-five-jurisdictions-will-decide-ballot-measures-related-to-data-centers-this-year/'},
  // VOTING
  {cat:'voting',lv:'state',loc:'VA (statewide)',title:'Virginia Congressional Redistricting Map Amendment',desc:'Allows GA to adopt emergency redistricting before Nov 2026 midterms to counter GOP gerrymanders in FL, TX, NC. On April 21 primary ballot.',status:'Qualified for ballot',date:'Apr 21, 2026',link:'https://ballot.org/the-hot-sheet/'},
  {cat:'voting',lv:'state',loc:'MA (statewide)',title:'Massachusetts Same-Day Voter Registration',desc:'Allows voters to register or update address at polls on Election Day. Backed by Secretary of State Galvin. 124K+ signatures submitted.',status:'Signatures submitted',date:'Nov 3, 2026',link:'https://www.wgbh.org/news/politics/2025-11-26/voting-reforms-rent-control-among-ballot-initiatives-poised-to-move-on-to-mass-legislature'},
  {cat:'voting',lv:'state',loc:'VA (statewide)',title:'Virginia Voting Rights Restoration for Felons Upon Release',desc:'Automatically restores voting rights upon release from incarceration. Legislatively referred.',status:'Qualified for ballot',date:'Nov 3, 2026',link:'https://ballotpedia.org/Ballot_Measure_Scorecard,_2026'},
  {cat:'voting',lv:'state',loc:'CA (statewide)',title:'California Public Campaign Financing',desc:'Repeals ban on public financing; allows state/local publicly funded campaigns under spending limits. Legislatively referred.',status:'Qualified for ballot',date:'Nov 3, 2026',link:'https://ballotpedia.org/Ballot_Measure_Scorecard,_2026'},
  {cat:'voting',lv:'state',loc:'MT (statewide)',title:'Montana Initiative Process Protection (CI-133)',desc:'Constitutional amendment requiring impartial, timely, open processes for citizen ballot initiatives.',status:'Approved for circulation',date:'Nov 3, 2026',link:'https://sosmt.gov/elections/ballot_issues/proposed-2026-ballot-issues/'},
  {cat:'voting',lv:'state',loc:'AR (statewide)',title:'Arkansas Direct Democracy Protections (2 campaigns)',desc:'Protect Arkansas Rights and Save AR Democracy collecting signatures to protect initiative process from legislative attacks.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://ballot.org/trends-watcher/'},
  {cat:'voting',lv:'state',loc:'MO (statewide)',title:'Missouri Direct Democracy Protection Initiative',desc:'Counter to legislature-referred "Protect Missouri Voters" amendment that would make citizen initiatives far harder to pass.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://ballot.org/trends-watcher/'},
  {cat:'voting',lv:'state',loc:'NE (statewide)',title:'Nebraska Direct Democracy Protection Initiative',desc:'Protects citizen initiative process from legislative rollback of voter-approved laws.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://ballot.org/trends-watcher/'},
  // CIVIL RIGHTS
  {cat:'civil',lv:'state',loc:'VA (statewide)',title:'Virginia Right to Reproductive Freedom Amendment',desc:'Enshrines abortion rights in the state constitution. Passed two successive legislative sessions. Gov. Spanberger signed Feb. 6.',status:'Qualified for ballot',date:'Nov 3, 2026',link:'https://ballotpedia.org/Ballot_Measure_Scorecard,_2026'},
  // REPRO
  {cat:'repro',lv:'state',loc:'ID (statewide)',title:'Idaho Reproductive Freedom and Privacy Act',desc:'Legalizes abortion through viability plus medical emergencies. 63K+ signatures as of January 2026. Steep geographic distribution requirement. Deadline May 1.',status:'Collecting signatures',date:'Nov 3, 2026',link:'https://ballotpedia.org/Idaho_Reproductive_Freedom_and_Privacy_Act_Initiative_(2026)'},
  {cat:'repro',lv:'state',loc:'VA (statewide)',title:'Virginia Right to Reproductive Freedom Amendment',desc:'Constitutional protection for abortion and reproductive rights. On the November ballot.',status:'Qualified for ballot',date:'Nov 3, 2026',link:'https://ballotpedia.org/Ballot_Measure_Scorecard,_2026'},
];

const CATS=['tax','econ','edu','housing','transit','env','data','voting','civil','repro'];
let active='all';

function row(d){
  const bc=SBC[d.status]||'ex';
  return `<tr>
    <td class="loc-cell">${d.loc}</td>
    <td class="tc">${lvb(d)}<br><a href="${d.link}" target="_blank">${d.title}</a></td>
    <td class="dc">${d.desc}</td>
    <td><span class="badge ${bc}">${d.status}</span></td>
    <td class="date-cell">${d.date}</td>
  </tr>`;
}

function noteForCat(cat){
  const notes={
    econ:`<div class="note">⚠️ Texas (Houston, San Antonio, Dallas, Austin, Fort Worth): Texas preempts cities from setting minimum wages or most labor regulations above state law ($7.25/hr). No city-level wage or worker protection ballot initiatives are legally possible. Texas Democratic primary had 13 advisory propositions on wages, housing, etc. — non-binding signals only.</div>`,
    voting:`<div class="note">⚠️ Chicago: Illinois ballot initiative law is highly restrictive. Binding city referendums require City Council to refer them; citizen-initiated binding measures on most topics are not permitted. Chicago's "Bring Chicago Home" real estate transfer tax referendum failed 53–47% in March 2024 and has not been re-filed for 2026.</div>`,
    housing:`<div class="note">⚠️ Phoenix / Houston / San Antonio / Dallas: These cities in TX and AZ have not confirmed progressive housing ballot initiatives for November 2026. Phoenix's November 2026 election is for Council districts only; any proposition would need Council referral. TX cities are further constrained by state preemption.</div>`,
  };
  return notes[cat]||'';
}

function render(f){
  const cats=f==='all'?CATS:[f];
  let html='';
  for(const cat of cats){
    const items=D.filter(d=>d.cat===cat);
    if(!items.length) continue;
    html+=`<div class="section" id="s-${cat}">
      <div class="sec-head">
        <div class="sec-dot" style="background:${C[cat]}"></div>
        <span class="sec-title">${TL[cat]}</span>
        <span class="sec-count">${items.length} initiative${items.length!==1?'s':''}</span>
      </div>
      <table>
        <thead><tr>
          <th style="min-width:100px">Location</th>
          <th style="min-width:160px">Initiative</th>
          <th>Description</th>
          <th style="min-width:130px">Status</th>
          <th style="min-width:90px">Election</th>
        </tr></thead>
        <tbody>${items.map(row).join('')}</tbody>
      </table>
      ${noteForCat(cat)}
    </div>`;
  }
  document.getElementById('content').innerHTML=html;
}

document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('.npill');
  if(!b) return;
  active=b.dataset.s;
  document.querySelectorAll('.npill').forEach(p=>p.classList.toggle('on',p.dataset.s===active));
  render(active);
});
render('all');
</script>
